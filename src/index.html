<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlasPDF - Suite Locale Manipolazione e Correzione PDF</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/thumbnails.css">
    <link rel="stylesheet" href="css/toolbar.css">
    <link rel="stylesheet" href="css/tools.css">
    <link rel="stylesheet" href="css/textTool.css">
    <link rel="stylesheet" href="css/imageTool.css">
    <link rel="stylesheet" href="css/converter.css">
    <link rel="stylesheet" href="css/themes/modern.css">
</head>
<body class="theme-modern">
    <!-- BARRA DEGLI STRUMENTI SUPERIORE -->
    <header class="main-toolbar">
        <div class="toolbar-group">
            <div class="brand-badge">Blas<span>PDF</span> <span class="badge-pill">Local-First</span></div>
            <div class="view-switch-tabs">
                <button id="tabEditor" class="tab-btn active">📄 Editor</button>
                <button id="tabConverter" class="tab-btn">🔄 Conversioni</button>
            </div>
            <div class="toolbar-separator"></div>
            <button id="btnOpen" class="tool-btn primary" title="Apri PDF (Cmd+O)">📂 Apri</button>
            <button id="btnSave" class="tool-btn" title="Salva modifiche (Cmd+S)">💾 Salva</button>
            <div class="toolbar-separator"></div>
            <button id="btnRotatePage" class="tool-btn" title="Ruota pagina (R)">⟳ Ruota</button>
            <button id="btnMergePdf" class="tool-btn" title="Unisci un altro PDF">➕ Unisci</button>
            <button id="btnExtractPage" class="tool-btn" title="Estrai pagina">✂️ Estrai</button>
            <button id="btnDeletePage" class="tool-btn" title="Elimina pagina">🗑️ Elimina</button>
        </div>

        <div class="toolbar-group">
            <button id="btnPrevPage" class="tool-btn" title="Pagina precedente">◀</button>
            <span id="pageIndicator" class="page-indicator">- / -</span>
            <button id="btnNextPage" class="tool-btn" title="Pagina successiva">▶</button>
            <div class="toolbar-separator"></div>
            <button id="btnZoomOut" class="tool-btn" title="Riduci zoom">-</button>
            <span id="zoomIndicator" class="zoom-indicator">100%</span>
            <button id="btnZoomIn" class="tool-btn" title="Aumenta zoom">+</button>
        </div>

        <div class="toolbar-group">
            <button id="toolSelect" class="tool-btn active" title="Strumento Selezione">👆 Cursore</button>
            <button id="toolWhiteout" class="tool-btn" title="Strumento Bianchetto">🖍️ Bianchetto</button>
            <button id="toolText" class="tool-btn" title="Aggiungi Testo">✍️ Testo</button>
            <button id="toolSign" class="tool-btn" title="Apponi Firma">✒️ Firma</button>
            <button id="toolImage" class="tool-btn" title="Inserisci Immagine o Timbro">🖼️ Immagine</button>
            <div class="toolbar-separator"></div>
            <button id="btnUndo" class="tool-btn" title="Annulla (Cmd+Z)">↩</button>
            <button id="btnRedo" class="tool-btn" title="Ripristina (Cmd+Shift+Z)">↪</button>
        </div>
    </header>

    <!-- AREA DI LAVORO EDITOR DOCUMENTO -->
    <main class="app-container">
        <aside id="sidebarThumbnails" class="sidebar-thumbnails">
            <div style="padding: 12px; font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">Pagine</div>
            <div id="thumbnailsList" style="display: flex; flex-direction: column; gap: 12px; padding: 0 12px 24px 12px;"></div>
        </aside>
        <section id="mainViewport" class="main-viewport">
            <div id="emptyDropState" class="empty-state">
                <div class="drop-zone-border" id="dropZoneTrigger">
                    <div style="font-size: 48px;">📄</div>
                    <h2>Trascina qui il tuo documento PDF</h2>
                    <p style="font-size: 13px; max-width: 360px;">Elaborazione al 100% in locale sul tuo computer, senza cloud né abbonamenti.</p>
                    <div style="display: flex; gap: 8px; margin-top: 8px;">
                        <button id="btnBrowseEmpty" class="tool-btn primary">Sfoglia Documenti</button>
                        <button id="btnLoadSample" class="tool-btn" style="border-color: var(--border-light);">📄 Prova Esempio</button>
                    </div>
                </div>
            </div>
            <div id="pdfCanvasWrapper" class="pdf-canvas-container" style="display: none; position: relative;">
                <canvas id="pdfCanvas"></canvas>
                <div id="annotationOverlay" class="annotation-overlay"></div>
            </div>
        </section>
    </main>

    <!-- CENTRO CONVERSIONI LOCALE (MULTI-VIEW) -->
    <section id="converterContainer" class="converter-container" style="display: none;"></section>

    <!-- Modale Firma Grafica -->
    <div id="signatureModal" class="modal-backdrop" style="display: none;">
        <div class="modal-dialog">
            <div class="modal-header">
                <span>✒️ Apponi Firma Grafica</span>
                <button id="btnCloseSigModal" class="tool-btn" style="padding: 2px 8px;">✕</button>
            </div>
            <div class="signature-pad-container"><canvas id="signaturePad" class="signature-canvas"></canvas></div>
            <div class="modal-footer">
                <button id="btnClearSig" class="tool-btn">Pulisci</button>
                <button id="btnApplySig" class="tool-btn primary">Inserisci</button>
            </div>
        </div>
    </div>

    <!-- Modale Conferma Chiusura -->
    <div id="unsavedModal" class="modal-backdrop" style="display: none;">
        <div class="modal-dialog" style="max-width: 440px;">
            <div class="modal-header"><span>⚠️ Modifiche non salvate</span></div>
            <div style="padding: 18px; font-size: 13px; line-height: 1.5; color: var(--text-secondary);">Vuoi salvare il documento prima di uscire?</div>
            <div class="modal-footer" style="gap: 8px;">
                <button id="btnUnsavedCancel" class="tool-btn">Annulla</button>
                <button id="btnUnsavedDiscard" class="tool-btn" style="color: var(--accent-red); border-color: rgba(230,57,70,0.4);">Non Salvare</button>
                <button id="btnUnsavedSave" class="tool-btn primary">💾 Salva ed Esci</button>
            </div>
        </div>
    </div>

    <!-- Input file nascosti -->
    <input type="file" id="hiddenFileInput" accept="application/pdf" style="display: none;">
    <input type="file" id="mergeFileInput" accept="application/pdf" style="display: none;">
    <input type="file" id="hiddenImageInput" accept="image/*" style="display: none;">

    <script type="module" src="js/app.js"></script>
</body>
</html>
