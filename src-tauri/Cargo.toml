[package]
name = "blaspdf"
version = "1.0.0"
description = "BlasPDF - Suite desktop libera per manipolazione e correzione PDF"
authors = ["Mauro Beltrami - BlasOpen"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "blaspdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
dirs = "7.0.0"
rfd = "0.17.2"
